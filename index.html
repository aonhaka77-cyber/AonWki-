<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3d414d" />
    <title>AonWki</title>
    <link rel="stylesheet" href="./namumark.css" />
    <link rel="stylesheet" href="./interactions.css" />
    <link rel="stylesheet" href="./AonWiki.css" />
    <link rel="stylesheet" href="https://entrywiki.org/skins/nbs/assets/wikiContent-S3oAqOnJ.css" />
    <link rel="stylesheet" href="https://entrywiki.org/skins/nbs/assets/index-S_awFza6.css" />
    <link rel="stylesheet" href="https://entrywiki.org/skins/nbs/assets/prevNextBtn-DAuxILvp.css" />
    <style id="aonwki-nbs-adapter">
      body { background:#eee; }
      body.theseed-dark-mode { background:#000; color:#eee; }
      .bn-container { width:100%; max-width:none; margin:0; padding:0; }
      .bn-header { min-height:64px; width:100%; box-sizing:border-box; display:flex; align-items:center; gap:24px; padding:10px max(24px,calc((100vw - 1400px)/2)); background:var(--skin_nbs_brand_color,#343a40); color:#fff; box-shadow:none; }
      body.theseed-dark-mode .bn-header { background:#000; border-bottom:1px solid #444; }
      .bn-header a,.bn-header .bn-nav a { color:#fff!important; text-decoration:none; }
      .bn-logo { color:#fff!important; font-size:1.4rem; font-weight:700; white-space:nowrap; }
      .bn-header nav { display:flex; align-items:center; }
      .bn-nav { display:flex; align-items:center; gap:8px; margin:0; padding:0; list-style:none; }
      .bn-nav a { display:block; padding:9px; border-radius:6px; }
      .bn-nav a:hover { background:#ffffff20; }
      .bn-spacer { flex:1; }
      .bn-search { display:flex; align-items:center; gap:6px; }
      .bn-search input { min-width:180px; height:38px; padding:6px 12px; color:inherit; background:transparent; border:1px solid #777; border-radius:6px; }
      .bn-search button { height:38px; padding:0 14px; color:#fff; background:transparent; border:1px solid #777; border-radius:6px; cursor:pointer; }
      .bn-mobile-search { display:none!important; }
      .bn-main { width:calc(100% - 48px); max-width:1080px; margin:22px auto 0; padding:0; }
      .bn-tabs { display:flex; gap:18px; padding:0 0 10px; margin:0; list-style:none; border-bottom:1px solid #ccc; }
      .bn-page-meta { margin-top:18px; color:#777; font-size:.85rem; }
      .bn-title { margin:8px 0 14px; font-size:1.7rem; font-weight:600; }
      #content.bn-content { width:100%; max-width:1080px; margin:18px 0; padding:24px; border:1px solid #ccc; border-radius:8px; background:#fff; }
      body.theseed-dark-mode #content.bn-content { background:#000; border-color:#555; }
      #wiki-output { min-height:120px; }
      .bn-editor,.bn-metadata,.bn-status { margin:16px 0; padding:14px; border:1px solid #ccc; border-radius:8px; background:var(--light-article-background-color,#fff); }
      body.theseed-dark-mode .bn-editor,body.theseed-dark-mode .bn-metadata,body.theseed-dark-mode .bn-status { background:#1c1d1f; border-color:#555; }
      .bn-editor textarea { display:block; width:100%; min-height:180px; margin-top:12px; padding:12px; color:inherit; background:transparent; border:1px solid #aaa; border-radius:4px; font:inherit; resize:vertical; }
      .bn-footer { display:flex; justify-content:center; gap:8px; margin-top:28px; padding:24px; border-top:1px solid #ccc; }
      body.theseed-dark-mode .bn-footer { border-color:#444; }
      .bn-scroll-controls { position:fixed; right:18px; bottom:18px; display:flex; gap:6px; margin:0; padding:0; list-style:none; }
      .bn-scroll-controls a { display:grid; place-items:center; width:38px; height:38px; color:inherit; background:#fff; border:1px solid #aaa; border-radius:6px; text-decoration:none; }
      body.theseed-dark-mode .bn-scroll-controls a { background:#222; border-color:#555; }
      @media(max-width:830px) {
        .bn-header { flex-wrap:wrap; gap:8px; padding:10px 12px; }
        .bn-header nav[aria-label="주 메뉴"] { order:3; width:100%; }
        .bn-nav { width:100%; }
        .bn-nav a { padding:6px; }
        .bn-spacer { display:none; }
        .bn-search { margin-left:auto; }
        .bn-search input { min-width:0; width:130px; }
        .bn-main { width:100%; margin-top:8px; }
        #content.bn-content { border-width:0; border-radius:0; margin-top:0; padding:16px 12px; }
        .bn-title,.bn-page-meta,.bn-tabs { margin-left:12px; margin-right:12px; }
      }
    </style>
    <script>
      (function () {
        const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.addEventListener("DOMContentLoaded", () => document.body.classList.add(dark ? "theseed-dark-mode" : "theseed-light-mode"));
        if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
          document.body.classList.toggle("theseed-dark-mode", e.matches);
          document.body.classList.toggle("theseed-light-mode", !e.matches);
        });
      })();
    </script>
  </head>
  <body>
    <div class="bn-container" id="top">
      <header class="bn-header">
        <a class="bn-logo" href="./" aria-label="AonWki 홈">AonWki</a>
        <nav aria-label="주 메뉴">
          <ul class="bn-nav">
            <li><a href="#content">문서</a></li>
            <li><a href="#recent">최근 변경</a></li>
            <li><a href="#discussion">최근 토론</a></li>
          </ul>
        </nav>
        <div class="bn-spacer"></div>
        <form class="bn-search" role="search" onsubmit="return false">
          <input type="search" placeholder="문서 검색" aria-label="문서 검색" />
          <button type="submit" aria-label="검색">검색</button>
        </form>
        <nav class="bn-mobile-search" aria-label="모바일 검색">
          <form class="bn-search" role="search" onsubmit="return false">
            <input type="search" placeholder="문서 검색" aria-label="문서 검색" />
            <button type="submit">검색</button>
          </form>
        </nav>
      </header>

      <main class="bn-main">
        <ul class="bn-tabs" aria-label="문서 메뉴">
          <li><a href="#content">문서</a></li>
          <li><a href="#editor">원본</a></li>
        </ul>
        <div class="bn-page-meta">AonWki · 나무마크 렌더러</div>
        <h1 class="bn-title">문서 미리보기</h1>

        <article id="content" class="bn-content">
          <article id="wiki-output" class="wiki wiki-content" data-wiki></article>
        </article>

        <details class="bn-editor" id="editor" open>
          <summary>나무마크 원본 입력</summary>
          <textarea id="input" placeholder="나무마크 문법 입력" rows="10" disabled></textarea>
        </details>
        <pre id="metadata" class="bn-metadata" hidden></pre>
        <p id="status" class="bn-status" role="status">WASM loading…</p>
      </main>

      <footer class="bn-footer" id="bottom">
        AonWki · <a href="https://github.com/aonhaka77-cyber/AonWki-">GitHub</a>
        · <a href="https://entrywiki.org/">NBS skin reference</a>
      </footer>
      <ul class="bn-scroll-controls" aria-label="페이지 이동">
        <li><a href="#top" title="위로">↑</a></li>
        <li><a href="#bottom" title="아래로">↓</a></li>
      </ul>
    </div>

    <script type="module">
      import { initWasm, renderWithMetadata } from "./wasm.js";
      import { setupWikiInteractions } from "./interactions.js";

      const input = document.getElementById("input");
      const output = document.getElementById("wiki-output");
      const status = document.getElementById("status");
      const metadata = document.getElementById("metadata");
      const interactions = setupWikiInteractions(output);

      function update() {
        const source = input.value;
        interactions.reset();
        metadata.textContent = "";
        metadata.hidden = true;

        if (!source) {
          output.innerHTML = "";
          status.textContent = "문서 원본을 입력하면 여기에 미리보기가 표시됩니다.";
          return;
        }

        try {
          const startedAt = performance.now();
          const result = renderWithMetadata(source);
          const elapsed = performance.now() - startedAt;
          output.innerHTML = result.html;
          interactions.refresh();

          const info = [];
          if (result.categories.length) info.push(`분류: ${result.categories.join(", ")}`);
          if (result.backlinks.length) info.push(`역링크: ${result.backlinks.join(", ")}`);
          if (result.redirect_target != null) {
            const anchor = result.redirect_anchor == null ? "" : `#${result.redirect_anchor}`;
            info.push(`리다이렉트: ${result.redirect_target}${anchor}`);
          }
          metadata.textContent = info.join("\n");
          metadata.hidden = info.length === 0;
          status.textContent = `렌더링 완료 · ${elapsed.toFixed(2)}ms`;
        } catch (error) {
          output.innerHTML = "";
          status.textContent = "오류: " + error.message;
        }
      }

      input.addEventListener("input", update);
      try {
        await initWasm();
        input.disabled = false;
        status.textContent = "WASM 로드 완료 · 나무마크 원본을 입력하세요.";
        if (input.value) update();
      } catch (error) {
        status.textContent = "WASM 로드 오류: " + error.message;
      }
    </script>
  </body>
</html>
