<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eeeeee" />
    <title>AonWki</title>
    <link rel="stylesheet" href="./namumark.css" />
    <link rel="stylesheet" href="./interactions.css" />
    <link rel="stylesheet" href="./app.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="topmenu">
      <a class="brand" href="/" aria-label="AonWki 대문">AonWki</a>
      <form id="search-form" class="search" role="search">
        <label class="sr-only" for="search-input">문서 내 검색</label>
        <input id="search-input" type="search" placeholder="문서에서 찾기" autocomplete="off" />
        <button type="submit">검색</button>
      </form>
    </header>

    <main class="page-shell">
      <article class="page-card">
        <div class="title_top">
          <div class="eyebrow">AonWki · 자유로운 지식 공간</div>
          <h1 id="page-title">대문</h1>
        </div>

        <div class="notice" role="status">
          <strong>AonWki에 오신 것을 환영합니다.</strong>
          <span>문서 내용과 문법은 기존 Namumark 엔진으로 렌더링됩니다.</span>
        </div>

        <div class="classification" id="classification" hidden></div>

        <nav id="mainlist" aria-label="목차" hidden>
          <h2>목차</h2>
          <ol id="toc-list"></ol>
        </nav>

        <section class="document-area">
          <article id="content" class="wiki wiki-content" data-wiki aria-live="polite"></article>
        </section>

        <footer class="page-footer">
          <span id="status">WASM 로딩 중…</span>
          <button id="edit-toggle" type="button" disabled>문서 편집</button>
        </footer>

        <section id="editor-panel" class="editor-panel" hidden>
          <div class="editor-heading">
            <strong>문서 원문</strong>
            <span>기존 Namumark 문법을 사용합니다.</span>
          </div>
          <textarea id="source-editor" spellcheck="false" rows="14" aria-label="Namumark 원문"></textarea>
          <div class="editor-actions">
            <button id="cancel-edit" type="button" class="secondary">취소</button>
            <button id="save-edit" type="button">미리보기 반영</button>
          </div>
          <p class="editor-note">저장 내용은 현재 브라우저에만 보관됩니다.</p>
        </section>
      </article>
    </main>
  </body>
</html>
